services:
  - type: web
    name: lincolns-net-backend
    env: python
    pythonVersion: 3.11.0  # Force Python 3.11
    region: frankfurt
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://lincolns-net.vercel.app
      - key: BACKEND_URL
        sync: false
      - key: RADIUS_SECRET
        sync: false
      - key: MIKROTIK_IP
        value: 192.168.88.1
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
    autoDeploy: true
