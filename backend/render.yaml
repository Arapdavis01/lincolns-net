services:
  - type: web
    name: lincolns-net-backend
    env: python
    region: frankfurt  # Choose closest to Kenya
    plan: free  # Start with free, upgrade as needed
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT --workers 4
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://lincolns-net.vercel.app
      - key: BACKEND_URL
        sync: false
      - key: RADIUS_SECRET
        sync: false
      - key: MIKROTIK_IP
        value: 192.168.88.1
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: PAYMENT_GATEWAY_URL
        value: https://api.payhero.co.ke
    autoDeploy: true
