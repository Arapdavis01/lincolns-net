services:
  - type: web
    name: lincolns-net-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://lincolns-net.vercel.app
      - key: BACKEND_URL
        sync: false
      - key: RADIUS_SECRET
        sync: false
      - key: MIKROTIK_IP
        sync: false
