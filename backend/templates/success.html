<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a73e8">
    <title>Connecting to Lincoln's net...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 40px 32px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .success-icon {
            width: 100px;
            height: 100px;
            background: #48bb78;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            animation: scaleIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
        .success-icon svg {
            width: 50px;
            height: 50px;
            fill: white;
        }
        
        .title {
            font-size: 28px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 16px;
        }
        
        .message {
            font-size: 16px;
            color: #718096;
            margin-bottom: 32px;
            line-height: 1.5;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top-color: #667eea;
            border-radius: 50%;
            margin: 0 auto;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 24px;
        }
        
        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 2px;
            animation: progress 3s ease-in-out infinite;
        }
        
        @keyframes progress {
            0% { width: 0%; }
            50% { width: 100%; }
            100% { width: 0%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">
            <svg viewBox="0 0 24 24">
                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
            </svg>
        </div>
        
        <h1 class="title">Payment Successful!</h1>
        <p class="message">
            Connecting you to Lincoln's net WiFi...
            <br>Please wait a moment
        </p>
        
        <div class="spinner"></div>
        <div class="progress-bar">
            <div class="progress-bar-fill"></div>
        </div>
    </div>
    
    <script>
        // Auto-submit form to MikroTik router
        window.onload = function() {
            // Get URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const mac = urlParams.get('mac');
            const ip = urlParams.get('ip');
            const linkLoginOnly = urlParams.get('link_login_only');
            const username = urlParams.get('username');
            const password = urlParams.get('password');
            
            // Construct login URL
            let loginUrl = 'http://192.168.88.1/login';
            
            // Build query parameters
            const params = [];
            
            if (username) {
                params.push('username=' + encodeURIComponent(username));
            } else if (mac) {
                params.push('username=' + encodeURIComponent(mac));
            }
            
            if (password) {
                params.push('password=' + encodeURIComponent(password));
            } else if (mac) {
                // Use MAC address as password if not provided
                params.push('password=' + encodeURIComponent(mac.toLowerCase().replace(/:/g, '')));
            }
            
            if (linkLoginOnly) {
                params.push('link-login-only=' + encodeURIComponent(linkLoginOnly));
            }
            
            if (mac) {
                params.push('mac=' + encodeURIComponent(mac));
            }
            
            if (ip) {
                params.push('ip=' + encodeURIComponent(ip));
            }
            
            // Add query parameters to URL
            if (params.length > 0) {
                loginUrl += '?' + params.join('&');
            }
            
            // Create hidden form and submit
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = loginUrl;
            form.style.display = 'none';
            
            // Add parameters as hidden inputs
            params.forEach(param => {
                const [key, value] = param.split('=');
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = key;
                input.value = decodeURIComponent(value);
                form.appendChild(input);
            });
            
            document.body.appendChild(form);
            
            // Delay submission slightly for better UX
            setTimeout(function() {
                form.submit();
            }, 2000);
        };
    </script>
</body>
</html>
