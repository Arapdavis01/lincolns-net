<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1b2a4c">
    <title>Lincoln's net - WiFi Access</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- ====================================================================
    HEADER BAR
    ==================================================================== -->
    <header class="portal-header-bar">
        <div class="header-content">
            <div class="logo-area">
                <div class="logo-box">
                    <i class="fas fa-wifi"></i>
                </div>
                <h1>LINCOLN'S NET</h1>
            </div>
            <a href="#" class="paid-link" onclick="checkAlreadyPaid(event)">
                <i class="fas fa-check-circle"></i> Already Paid? Click Here
            </a>
        </div>
    </header>
    
    <!-- ====================================================================
    MAIN CONTENT
    ==================================================================== -->
    <main class="portal-main">
        <div class="container">
            <!-- Page Title -->
            <div class="page-title">
                <h2>CHECK OUR PRICING</h2>
                <p>Choose a plan that fits your needs</p>
            </div>
            
            <!-- ============================================================
            PRICING GRID (2-Column Layout - Always)
            ============================================================ -->
            <div class="pricing-grid" id="pricingGrid">
                <!-- Loading State -->
                <div class="loading-state" id="loadingState">
                    <div class="spinner"></div>
                    <p>Loading packages...</p>
                </div>
                
                <!-- Error State -->
                <div class="error-state" id="errorState" style="display: none;">
                    <i class="fas fa-exclamation-circle"></i>
                    <p>Failed to load packages</p>
                    <button class="btn-retry" onclick="loadPackages()">
                        <i class="fas fa-refresh"></i> Retry
                    </button>
                </div>
            </div>
        </div>
    </main>
    
    <!-- ====================================================================
    PACKAGE SELECTION MODAL (Shows on card click)
    ==================================================================== -->
    <div class="modal" id="packageSelectionModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-shopping-cart"></i> Confirm Package</h2>
                <button class="modal-close" onclick="closeModal('packageSelectionModal')">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <!-- Selected Package Details -->
            <div id="selectedPackageDetails" style="margin-bottom: 20px;">
                <!-- Filled dynamically -->
            </div>
            
            <!-- Phone Number Input -->
            <div class="form-group">
                <label class="form-label" for="modalPhoneNumber">
                    <i class="fas fa-mobile-alt"></i> Phone Number (M-Pesa)
                </label>
                <div class="input-group">
                    <span class="input-icon"><i class="fas fa-phone"></i></span>
                    <input 
                        type="tel" 
                        id="modalPhoneNumber" 
                        class="form-input" 
                        placeholder="e.g., 0712345678" 
                        maxlength="10"
                        pattern="[0-9]{10}"
                        inputmode="numeric"
                        required
                    >
                </div>
            </div>
            
            <!-- Connect Button -->
            <button class="btn btn-primary btn-block" onclick="confirmPackage()" id="modalConnectButton">
                <i class="fas fa-plug"></i> Connect Now
            </button>
        </div>
    </div>
    
    <!-- ====================================================================
    BOTTOM TV BAR
    ==================================================================== -->
    <div class="bottom-tv-bar" id="bottomTvBar" style="display: none;">
        <button onclick="openTvModal()">
            <i class="fas fa-tv"></i> Connect TV Here
        </button>
    </div>
    
    <!-- ====================================================================
    FLOATING SUPPORT BUTTON
    ==================================================================== -->
    <a href="#" class="floating-phone" id="floatingPhone" onclick="callSupport(event)">
        <i class="fas fa-phone-alt"></i>
    </a>
    
    <!-- ====================================================================
    ALREADY PAID MODAL
    ==================================================================== -->
    <div class="modal" id="paidModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-check-circle"></i> Already Paid?</h2>
                <button class="modal-close" onclick="closeModal('paidModal')">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="paidModalContent">
                <p style="margin-bottom: 16px;">Checking your session...</p>
            </div>
        </div>
    </div>
    
    <!-- ====================================================================
    TV MODAL
    ==================================================================== -->
    <div class="modal" id="tvModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-tv"></i> Connect TV</h2>
                <button class="modal-close" onclick="closeModal('tvModal')">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <p style="margin-bottom: 16px;">Enter your TV's MAC address to connect:</p>
            
            <div class="input-group">
                <span class="input-icon"><i class="fas fa-tv"></i></span>
                <input type="text" id="tvMac" class="form-input" placeholder="e.g., AA:BB:CC:DD:EE:FF">
            </div>
            
            <p style="margin-bottom: 16px; margin-top: 16px;">Select a package for your TV:</p>
            <select id="tvPackageSelect" class="form-input" style="margin-bottom: 16px;">
                <option value="">Select package...</option>
            </select>
            
            <button class="btn btn-primary btn-block" onclick="connectTv()">
                <i class="fas fa-plug"></i> Connect TV
            </button>
        </div>
    </div>
    
    <!-- ====================================================================
    JAVASCRIPT
    ==================================================================== -->
    <script>
        const BACKEND_URL = 'https://lincolns-net-backend.onrender.com';
        const CURRENCY = 'KES';
        
        let selectedPackageId = null;
        let packagesList = [];
        let supportPhone = '+254700000000';
        let tvSupportEnabled = false;
        
        // ================================================================
        // INITIALIZATION
        // ================================================================
        
        document.addEventListener('DOMContentLoaded', function() {
            loadPublicSettings();
            loadPackages();
            checkActiveSession();
        });
        
        // ================================================================
        // LOAD PUBLIC SETTINGS
        // ================================================================
        
        async function loadPublicSettings() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/settings/public`);
                const data = await response.json();
                
                if (data.success) {
                    supportPhone = data.support_phone || '+254700000000';
                    tvSupportEnabled = data.tv_support_enabled || false;
                    
                    document.getElementById('floatingPhone').href = `tel:${supportPhone}`;
                    
                    if (tvSupportEnabled) {
                        document.getElementById('bottomTvBar').style.display = 'flex';
                    }
                }
            } catch (error) {
                console.error('Error loading settings:', error);
            }
        }
        
        // ================================================================
        // LOAD PACKAGES
        // ================================================================
        
        async function loadPackages() {
            const grid = document.getElementById('pricingGrid');
            const loading = document.getElementById('loadingState');
            const error = document.getElementById('errorState');
            
            loading.style.display = 'flex';
            error.style.display = 'none';
            
            try {
                const response = await fetch(`${BACKEND_URL}/api/packages`);
                const data = await response.json();
                
                if (data.success && data.packages.length > 0) {
                    packagesList = data.packages.filter(pkg => pkg.is_active);
                    renderPackages(packagesList);
                    populateTvPackageSelect(packagesList);
                } else {
                    error.style.display = 'flex';
                }
            } catch (err) {
                console.error('Error loading packages:', err);
                error.style.display = 'flex';
            } finally {
                loading.style.display = 'none';
            }
        }
        
        // ================================================================
        // RENDER PACKAGES
        // ================================================================
        
        function renderPackages(packages) {
            const grid = document.getElementById('pricingGrid');
            
            if (packages.length === 0) {
                grid.innerHTML = `
                    <div class="error-state" style="display: flex; grid-column: 1 / -1;">
                        <i class="fas fa-box-open"></i>
                        <p>No packages available at the moment</p>
                    </div>
                `;
                return;
            }
            
            grid.innerHTML = packages.map(pkg => `
                <div class="pricing-card ${pkg.supports_tv ? 'supports-tv' : ''}" 
                     onclick="selectPackage(${pkg.id})" 
                     data-package-id="${pkg.id}">
                    <div class="card-details">
                        <p class="plan-title">${pkg.name}</p>
                        <h3 class="price">${CURRENCY} ${parseFloat(pkg.price).toLocaleString()}</h3>
                        <p class="duration">
                            <i class="fas fa-hourglass-half"></i> ${formatDuration(pkg.duration_seconds)}
                        </p>
                        <div class="package-meta">
                            <span class="speed-badge">
                                <i class="fas fa-download"></i> ${pkg.download_rate_limit}
                            </span>
                            <span class="speed-badge">
                                <i class="fas fa-upload"></i> ${pkg.upload_rate_limit}
                            </span>
                            ${pkg.max_users > 1 ? `
                            <span class="users-badge">
                                <i class="fas fa-users"></i> ${pkg.max_users}
                            </span>
                            ` : ''}
                            ${pkg.supports_tv ? `
                            <span class="tv-badge">
                                <i class="fas fa-tv"></i>
                            </span>
                            ` : ''}
                        </div>
                    </div>
                    <button class="btn-select">
                        <i class="fas fa-mouse-pointer"></i> Select
                    </button>
                </div>
            `).join('');
        }
        
        // ================================================================
        // POPULATE TV PACKAGE SELECT
        // ================================================================
        
        function populateTvPackageSelect(packages) {
            const select = document.getElementById('tvPackageSelect');
            const tvPackages = packages.filter(pkg => pkg.supports_tv);
            
            if (tvPackages.length === 0) {
                select.innerHTML = '<option value="">No TV packages available</option>';
                return;
            }
            
            select.innerHTML = tvPackages.map(pkg => `
                <option value="${pkg.id}">${pkg.name} - ${CURRENCY} ${parseFloat(pkg.price).toLocaleString()}</option>
            `).join('');
        }
        
        // ================================================================
        // PACKAGE SELECTION - Opens Modal (NO auto-scroll)
        // ================================================================
        
        function selectPackage(packageId) {
            selectedPackageId = packageId;
            
            // Update selected state on cards
            document.querySelectorAll('.pricing-card').forEach(card => {
                card.classList.remove('selected');
            });
            document.querySelector(`[data-package-id="${packageId}"]`).classList.add('selected');
            
            // Find package details
            const pkg = packagesList.find(p => p.id === packageId);
            if (pkg) {
                // Fill modal with package details
                document.getElementById('selectedPackageDetails').innerHTML = `
                    <div style="text-align: center; padding: 16px; background: #f0f9ff; border-radius: 12px; border: 2px solid #38bdf8;">
                        <h3 style="color: #1b2a4c; margin-bottom: 8px; font-size: 18px;">${pkg.name}</h3>
                        <div style="font-size: 24px; font-weight: 700; color: #0ea5e9;">
                            ${CURRENCY} ${parseFloat(pkg.price).toLocaleString()}
                        </div>
                        <div style="font-size: 14px; color: #718096; margin-top: 8px;">
                            <i class="fas fa-hourglass-half"></i> ${formatDuration(pkg.duration_seconds)}
                            <span style="margin: 0 8px;">|</span>
                            <i class="fas fa-download"></i> ${pkg.download_rate_limit}
                            <span style="margin: 0 8px;">|</span>
                            <i class="fas fa-upload"></i> ${pkg.upload_rate_limit}
                        </div>
                        ${pkg.max_users > 1 ? `
                        <div style="font-size: 12px; color: #718096; margin-top: 4px;">
                            <i class="fas fa-users"></i> Supports up to ${pkg.max_users} devices
                        </div>
                        ` : `
                        <div style="font-size: 12px; color: #718096; margin-top: 4px;">
                            <i class="fas fa-user"></i> Single device only
                        </div>
                        `}
                    </div>
                `;
                
                // Clear phone input
                document.getElementById('modalPhoneNumber').value = '';
                
                // Open modal
                document.getElementById('packageSelectionModal').classList.add('open');
            }
        }
        
        // ================================================================
        // CONFIRM PACKAGE FROM MODAL
        // ================================================================
        
        function confirmPackage() {
            const phoneNumber = document.getElementById('modalPhoneNumber').value.trim();
            
            if (!selectedPackageId) {
                alert('Please select a package');
                return;
            }
            
            if (!phoneNumber || phoneNumber.length < 10) {
                alert('Please enter a valid 10-digit phone number');
                return;
            }
            
            // Close modal
            closeModal('packageSelectionModal');
            
            // Proceed to payment
            connectNow(phoneNumber);
        }
        
        // ================================================================
        // CHECK ACTIVE SESSION
        // ================================================================
        
        async function checkActiveSession() {
            const urlParams = new URLSearchParams(window.location.search);
            const mac = urlParams.get('mac') || '';
            
            if (!mac) return;
            
            try {
                const response = await fetch(`${BACKEND_URL}/api/check-active-session?mac=${encodeURIComponent(mac)}`);
                const data = await response.json();
                
                if (data.success && data.has_active_session) {
                    showPaidModalWithSession(data.transaction);
                }
            } catch (error) {
                console.error('Error checking session:', error);
            }
        }
        
        function checkAlreadyPaid(event) {
            event.preventDefault();
            
            const urlParams = new URLSearchParams(window.location.search);
            const mac = urlParams.get('mac') || '';
            
            if (!mac) {
                document.getElementById('paidModalContent').innerHTML = `
                    <p style="margin-bottom: 16px;">We couldn't detect your device. Please enter your phone number:</p>
                    <div class="input-group">
                        <span class="input-icon"><i class="fas fa-phone"></i></span>
                        <input type="tel" id="reconnectPhone" class="form-input" placeholder="Phone number" maxlength="10">
                    </div>
                    <button class="btn btn-primary btn-block" onclick="checkByPhone()">
                        <i class="fas fa-search"></i> Check Session
                    </button>
                `;
            } else {
                document.getElementById('paidModalContent').innerHTML = `
                    <div style="text-align: center; padding: 20px;">
                        <div class="spinner"></div>
                        <p style="margin-top: 12px;">Checking your session...</p>
                    </div>
                `;
                
                fetch(`${BACKEND_URL}/api/check-active-session?mac=${encodeURIComponent(mac)}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.success && data.has_active_session) {
                            showPaidModalWithSession(data.transaction);
                        } else {
                            document.getElementById('paidModalContent').innerHTML = `
                                <p style="margin-bottom: 16px; color: #e53e3e;">
                                    <i class="fas fa-exclamation-circle"></i> 
                                    No active session found. Please purchase a new package.
                                </p>
                                <button class="btn btn-primary btn-block" onclick="closeModal('paidModal')">
                                    <i class="fas fa-times"></i> Close
                                </button>
                            `;
                        }
                    });
            }
            
            document.getElementById('paidModal').classList.add('open');
        }
        
        function showPaidModalWithSession(transaction) {
            const pkg = transaction.package || {};
            const expiresAt = transaction.expires_at ? new Date(transaction.expires_at).toLocaleString() : 'N/A';
            
            document.getElementById('paidModalContent').innerHTML = `
                <div style="text-align: center; padding: 20px;">
                    <i class="fas fa-check-circle" style="font-size: 48px; color: #48bb78;"></i>
                    <h3 style="margin: 16px 0; color: #2d3748;">Active Session Found!</h3>
                    <p style="margin-bottom: 8px;"><strong>Package:</strong> ${pkg.name || 'Unknown'}</p>
                    <p style="margin-bottom: 8px;"><strong>Expires:</strong> ${expiresAt}</p>
                    <button class="btn btn-success btn-block" onclick="reconnectDevice()">
                        <i class="fas fa-plug"></i> Reconnect Now
                    </button>
                </div>
            `;
        }
        
        function checkByPhone() {
            const phone = document.getElementById('reconnectPhone').value;
            if (!phone) {
                alert('Please enter your phone number');
                return;
            }
            alert('Phone number check coming soon');
        }
        
        function reconnectDevice() {
            const urlParams = new URLSearchParams(window.location.search);
            const mac = urlParams.get('mac') || '';
            const linkLoginOnly = urlParams.get('link_login_only') || '';
            window.location.href = `${BACKEND_URL}/success?mac=${mac}&link_login_only=${linkLoginOnly}`;
        }
        
        // ================================================================
        // CONNECT TO WIFI
        // ================================================================
        
        async function connectNow(phoneNumber) {
            const connectButton = document.getElementById('modalConnectButton');
            
            connectButton.disabled = true;
            connectButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            
            const urlParams = new URLSearchParams(window.location.search);
            const mac = urlParams.get('mac') || '';
            const ip = urlParams.get('ip') || '';
            const linkLoginOnly = urlParams.get('link_login_only') || '';
            
            try {
                const response = await fetch(`${BACKEND_URL}/api/pay`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        package_id: selectedPackageId,
                        phone_number: phoneNumber,
                        mac: mac,
                        ip: ip,
                        link_login_only: linkLoginOnly,
                        device_type: 'phone',
                    }),
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    alert('Payment initiated! Check your phone for M-Pesa prompt.');
                } else {
                    alert(data.error || 'Payment initiation failed');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error connecting to payment service');
            } finally {
                connectButton.disabled = false;
                connectButton.innerHTML = '<i class="fas fa-plug"></i> Connect Now';
            }
        }
        
        // ================================================================
        // TV CONNECTION
        // ================================================================
        
        function openTvModal() {
            document.getElementById('tvModal').classList.add('open');
        }
        
        async function connectTv() {
            const tvMac = document.getElementById('tvMac').value.trim();
            const packageId = document.getElementById('tvPackageSelect').value;
            
            if (!tvMac) {
                alert('Please enter TV MAC address');
                return;
            }
            
            if (!packageId) {
                alert('Please select a package');
                return;
            }
            
            try {
                const response = await fetch(`${BACKEND_URL}/api/connect-tv`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        tv_mac: tvMac,
                        package_id: parseInt(packageId),
                    }),
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('TV connected successfully!');
                    closeModal('tvModal');
                } else {
                    alert(data.error || 'Failed to connect TV');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error connecting TV');
            }
        }
        
        // ================================================================
        // SUPPORT CALL
        // ================================================================
        
        function callSupport(event) {
            event.preventDefault();
            window.location.href = `tel:${supportPhone}`;
        }
        
        // ================================================================
        // UTILITY FUNCTIONS
        // ================================================================
        
        function formatDuration(seconds) {
            if (!seconds) return '-';
            if (seconds < 60) return `${seconds} sec`;
            if (seconds < 3600) return `${Math.floor(seconds / 60)} mins`;
            if (seconds < 86400) return `${Math.floor(seconds / 3600)} hrs`;
            if (seconds < 604800) return `${Math.floor(seconds / 86400)} days`;
            return `${Math.floor(seconds / 2592000)} months`;
        }
        
        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('open');
        }
    </script>
</body>
</html>
