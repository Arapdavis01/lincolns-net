<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lincoln's net - WiFi Access</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 24px;
            padding: 40px 24px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 36px;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 8px;
        }
        p {
            font-size: 16px;
            color: #718096;
            margin-bottom: 24px;
        }
        .package {
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            margin: 12px 0;
            cursor: pointer;
            transition: all 0.3s;
        }
        .package.selected {
            border-color: #667eea;
            background: #f7fafc;
        }
        .package-name {
            font-size: 18px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 4px;
        }
        .package-price {
            font-size: 20px;
            font-weight: 700;
            color: #667eea;
        }
        input {
            width: 100%;
            padding: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            margin: 16px 0;
        }
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
        }
        .footer {
            font-size: 12px;
            margin-top: 20px;
            color: #a0aec0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📶</div>
        <h1>Lincoln's net</h1>
        <p>Fast, Reliable WiFi Access</p>
        
        <div class="package" onclick="selectPackage(this)">
            <div class="package-name">Hourly Pass</div>
            <div class="package-price">$1.00</div>
            <small>1 hour | 5M download | 2M upload</small>
        </div>
        
        <div class="package" onclick="selectPackage(this)">
            <div class="package-name">Daily Pass</div>
            <div class="package-price">$3.00</div>
            <small>24 hours | 10M download | 5M upload</small>
        </div>
        
        <div class="package" onclick="selectPackage(this)">
            <div class="package-name">Weekly Pass</div>
            <div class="package-price">$15.00</div>
            <small>7 days | 20M download | 10M upload</small>
        </div>
        
        <input type="tel" placeholder="Phone Number (M-Pesa)" maxlength="10">
        
        <button onclick="alert('Connecting...')">Connect Now</button>
        
        <div class="footer">Secure payment via M-Pesa | Powered by Lincoln's net</div>
    </div>
    
    <script>
        function selectPackage(element) {
            document.querySelectorAll('.package').forEach(p => {
                p.classList.remove('selected');
            });
            element.classList.add('selected');
        }
    </script>
</body>
</html>
